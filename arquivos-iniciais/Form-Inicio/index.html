<body>
<!-- CABEÇALHO AQUI -->
	<header>
        <h1>Proposta de Curso</h1>
        <h2>Design de Formulários Web</h2>
    </header>
    
    
<!-- NAVEGAÇÃO AQUI -->
    <nav>
        <ul>
            <li><a href="#">Sobre</a></li>
            <li class="ativo"><a href="#">Propor</a></li>
            <li><a href="#">Vencedores</a></li>
            <li><a href="#">Contato</a></li>    
        </ul>
    </nav>
    
    
<!-- CONTEÚDO AQUI -->
<main>
    <h1>Formulário de Proposta de Curso</h1>
    <form method="get" action="obrigado.html" class="FW1">
        <fieldset>
            <legend>Informações do candidato</legend>
            <label>Nome:*<input type="text" name="nome" required> </label>
            <label>Sobrenome:*<input type="text" name="sobrenome" required> </label>
            <label>Telefone:*<input type="tel" name="fone" placeholder="(123) 456-7890"> </label>
            <label>Email:*<input type="email" name="email" placeholder="seu.email@exemplo.com" required> </label>
            <label>Website:<input type="url" name="website" placeholder="https://exemplo.com"> </label>
        </fieldset>

        <fieldset>
            <legend>Informações do curso</legend>
            <div>Publico-alvo</div>
            <label><input type="radio" name="publico" value="iniciante">Iniciante</label>
            <label><input type="radio" name="publico" value="intermediario">Intermediário</label>
            <label><input type="radio" name="publico" value="avancado">Avançado</label>
            
            <div>Software necessário</div>
            <label><input type="checkbox" name="edicao" value="sim">Edição de fotos</label>
            <label><input type="checkbox" name="programacao" value="sim">Programação</label>
            <label><input type="checkbox" name="processador" value="sim">Pré-processador</label>
            <label><input type="checkbox" name="cliente" value="sim">Cliente FTP</label>
        </fieldset>

        <fieldset>
            <legend>Financiamento</legend>
            <label>Data prevista de conclusão <input type="date" name="data"> </label>

            <label>Área do curso 
                <select name="tema">
                    <option value="">Selecione</option>
                    <option value="desenvolvimento de software">Desenvolvimento de software</option>
                    <option value="profissional criativo">Profissional criativo</option>
                    <option value="tecnologia da informacao">Tecnologia da informação</option>
                    <option value="negocios">Negócios</option>
                    <option value="analista de dados">Analista de dados</option>
                    <option value="segurança cibernética">Segurança Cibernética</option>
                    <option value="marketing digital">Marketing Digital</option>
                    <option value="manufatura">Manufatura</option>

                </select>

                <label>Quantidade de autores <input type="number" name="autores"> </label>

            </label>
        </fieldset>

        <input type="submit" value="propor meu curso">

    </form>
</main>
    
<!-- RODAPÉ AQUI -->   
    <footer>

    </footer>

</body>
