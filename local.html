<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página sobre a cidade de São Paulo contendo dados populacionais e informações de clima.">
    <meta name="author" content="Júlio Oliveira Batista de Jesus">
    
    <title>São Paulo</title>
    <link rel="stylesheet" href="estilos/local.css">
    <script src="scripts/local.js" defer></script>
</head>
<body>

    <div class="container">

        <header class="topo">
            <h1>São Paulo</h1>
        </header>

        <main>
            
            <div class="imagem-container">
                <picture>
                    <source srcset="imagens/principal-grande.webp" media="(min-width: 1000px)">
                    <source srcset="imagens/principal-media.webp" media="(min-width: 500px)">
                    <img src="imagens/principal-pequena.webp" srcset="imagens/principal-pequena.webp" alt="Foto da cidade de São Paulo">
                </picture>
            </div>

            <section class="card dados">
                <h2>Dados</h2>
                <p><strong>População:</strong> 11,45 milhões (IBGE 2022)</p>
                <p><strong>Área:</strong> 1.521 km²</p>
                <p><strong>Clima:</strong> Tropical de Altitude</p>
            </section>

            <section class="card clima">
                <h2>Clima</h2>
                <div class="icone-clima">
                    <img src="imagens/sol-nuvem.svg" alt="Parcialmente nublado" width="24" height="24">
                </div>
                <p><strong>Temperatura:</strong> 9 °C</p>
                <p><strong>Vento:</strong> 10 km/h</p>
                <p><strong>Sensação Térmica:</strong> <span id="sensacao">--</span></p>
                <p><strong>Condições:</strong> Ensolarado com chuvas em períodos específicos</p>
            </section>

        </main> 

        <footer class="rodape">
            <p>© <span id="ano"></span> São Paulo. ⚪ Júlio Oliveira Batista de Jesus ⚪</p>
            <p>Última modificação: <span id="modificacao"></span></p>
        </footer>

    </div>
    
</body>
</html>
