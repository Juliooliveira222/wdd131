<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São Paulo</title>
    <link rel="stylesheet" href="estilos/local.css">
</head>
<body>

    <div class="container">

        <header class="topo">
            <h1>São Paulo</h1>
        </header>

        <div class="imagem-container">
            <img src="imagens/sao-paulo.webp" alt="Imagem de São Paulo">
        </div>

        <section class="card dados">
            <h2>Data</h2>
            <p>População: 12,33 milhões (2021)</p>
            <p>Área: 1.521 km²</p>
            <p>Clima: Tropical de Altitude</p>
        </section>

        <section class="card clima">
            <h2>Clima</h2>
            <p>Temperatura: 9 °C</p>
            <p>Vento: 10 km/h</p>
            <p>Sensação Térmica: <span id="sensacao">--</span></p>
            <p>Condições: Ensolarado com chuvas em períodos específicos</p>
        </section>

        <footer class="rodape">
            <p>© <span id="ano"></span> São Paulo. ⚪ Júlio Oliveira Batista de Jesus ⚪</p>
            <p>Última modificação: <span id="modificacao"></span></p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
